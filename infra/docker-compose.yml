services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: face
      POSTGRES_PASSWORD: face
      POSTGRES_DB: face
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U face -d face"]
      interval: 5s
      retries: 10
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: face
      POSTGRES_PASSWORD: face
      POSTGRES_DB: face_test
    ports: ["5433:5432"]
    volumes: [pgtestdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:4200
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]
  api:
    build: ../backend
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://face:face@postgres:5432/face
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
  worker:
    build: ../backend
    command: celery -A app.infra.celery_app:celery_app worker --loglevel=info -I worker.tasks
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://face:face@postgres:5432/face
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
  frontend:
    build: ../frontend
    ports: ["4200:80"]
    depends_on: [api]
volumes:
  pgdata:
  pgtestdata:
  miniodata:
